<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - GameVerse</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>GameVerse</h1>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Catálogo</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li><a href="admin.html">Administración</a></li>
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="soporte.html">Soporte</a></li>
                <li><a href="comunidad.html">Comunidad</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-layout">
        
        <section class="lista-carrito">
            <h2>Tu Pedido</h2>
            <div id="items-carrito">
                </div>
            <h3>Total a Pagar: $<span id="total-pago">0.00</span></h3>
        </section>

        <aside class="checkout-form">
            <h2>Datos de Pago</h2>
            <form id="formulario-pago">
                <label for="nombre">Nombre en la tarjeta:</label>
                <input type="text" id="nombre" required>
                
                <label for="tarjeta">Número de tarjeta:</label>
                <input type="text" id="tarjeta" required maxlength="16">
                
                <label for="password">NIP / CVV:</label>
                <input type="password" id="password" required maxlength="4">

                <label>
                    <input type="checkbox" id="terminos" required> Acepto los términos y condiciones
                </label>

                <button type="button" id="btn-pagar">Confirmar Pago</button>
            </form>
        </aside>

    </main>

    <footer>
        <p>Desarrollado por Diego - Fundamentos de Tecnologías Web</p>
    </footer>

    <script src="js/carrito.js"></script>
</body>
</html>
