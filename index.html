<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - GameVerse</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>GameVerse</h1>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html" style="color: var(--acento-azul);">Catálogo</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li><a href="admin.html">Administración</a></li>
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="soporte.html">Soporte</a></li>
                <li><a href="comunidad.html">Comunidad</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero-banner">
        <div class="hero-contenido">
            <span class="etiqueta-reserva">RESERVA</span>
            <h2>ELDEN RING: SHADOW OF THE ERDTREE - ¡YA DISPONIBLE!</h2>
            <button class="btn-amarillo">RESERVAR AHORA</button>
        </div>
    </section>

    <main class="contenedor-principal">
        
        <aside class="sidebar-filtros">
            <h3>Filtros</h3>
            
            <div class="grupo-filtro" style="margin-bottom: 15px;">
                <label for="busqueda" style="display: block; margin-bottom: 5px;">Buscar juego:</label>
                <input type="text" id="busqueda" placeholder="Ej. Cyberpunk..." style="width: 100%; padding: 10px; border-radius: 5px; border: none; background: #333; color: white;">
            </div>
            
            <div class="grupo-filtro" style="margin-bottom: 15px;">
                <label for="filtro-genero" style="display: block; margin-bottom: 5px;">Género:</label>
                <select id="filtro-genero" style="width: 100%; padding: 10px; border-radius: 5px; border: none; background: #333; color: white;">
                    <option value="todos">Todos</option>
                    <option value="acción">Acción</option>
                    <option value="rpg">RPG</option>
                    <option value="shooter">Shooter</option>
                </select>
            </div>
            
            <button id="btn-filtrar" class="btn-azul" style="width: 100%; padding: 12px; font-size: 1em;">Aplicar Filtros</button>
        </aside>

        <section class="area-juegos">
            <h2 class="titulo-seccion">LANZAMIENTOS DESTACADOS</h2>
            <div id="contenedor-juegos" class="grid-juegos">
                </div>
        </section>

    </main>

    <footer>
        <p>Desarrollado por Diego - Fundamentos de Tecnologías Web</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
